<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0c1322; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; border-radius:12px; border:1px solid #1e293b;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#172238" rx="12"/>
  <circle cx="30" cy="25" r="6" fill="#ef4444"/>
  <circle cx="50" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="30" fill="#94a3b8" font-size="14" font-weight="600">🤖 ClawMux Router — Omni-Channel Control Plane for OpenClaw Workspaces</text>
  <rect x="820" y="14" width="150" height="24" rx="12" fill="#6366f1" fill-opacity="0.2"/>
  <text x="895" y="30" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle">⚡ OMNI-ROUTER ONLINE</text>

  <!-- Messengers Column -->
  <rect x="20" y="70" width="240" height="390" fill="#131d31" rx="8"/>
  <text x="35" y="100" fill="#38bdf8" font-size="12" font-weight="700">CORPORATE MESSENGERS</text>

  <rect x="35" y="115" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="45" y="138" fill="#e2e8f0" font-size="13">💬 Mattermost (WS + REST)</text>

  <rect x="35" y="160" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="45" y="183" fill="#e2e8f0" font-size="13">✈️ Telegram (Long Polling)</text>

  <rect x="35" y="205" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="45" y="228" fill="#e2e8f0" font-size="13">🔷 Bitrix24 (Webhook API)</text>

  <rect x="35" y="250" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="45" y="273" fill="#e2e8f0" font-size="13">🟪 Slack (Socket Mode)</text>

  <rect x="35" y="295" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="45" y="318" fill="#e2e8f0" font-size="13">🛡️ VK Teams / Myteam</text>

  <rect x="35" y="340" width="210" height="36" rx="6" fill="#1e293b"/>
  <text x="45" y="363" fill="#e2e8f0" font-size="13">🟦 Microsoft Teams</text>

  <rect x="35" y="390" width="210" height="50" rx="6" fill="#0f172a" stroke="#3b82f6"/>
  <text x="45" y="410" fill="#60a5fa" font-size="11" font-weight="600">Active Sessions: 42</text>
  <text x="45" y="426" fill="#94a3b8" font-size="10">Real-time Stream: 120 msgs/s</text>

  <!-- Core Router Column -->
  <rect x="280" y="70" width="400" height="390" fill="#0f172a" rx="8" stroke="#334155"/>
  <text x="300" y="100" fill="#818cf8" font-size="14" font-weight="700">CLAWMUX CONTROL PLANE ENGINE</text>

  <rect x="300" y="120" width="360" height="60" rx="8" fill="#1e1b4b" stroke="#4f46e5"/>
  <text x="315" y="143" fill="#c7d2fe" font-size="13" font-weight="700">ProviderRegistry &amp; Dispatcher</text>
  <text x="315" y="162" fill="#a5b4fc" font-size="11">Resolves User IDs, Channel Contexts &amp; Thread IDs</text>

  <rect x="300" y="195" width="360" height="60" rx="8" fill="#1e293b"/>
  <text x="315" y="218" fill="#38bdf8" font-size="13" font-weight="700">Lazy Auto-Provisioner Engine</text>
  <text x="315" y="237" fill="#94a3b8" font-size="11">Spawns isolated OpenClaw container on 1st message</text>

  <rect x="300" y="270" width="360" height="60" rx="8" fill="#1e293b"/>
  <text x="315" y="293" fill="#34d399" font-size="13" font-weight="700">Workspace Template Sync</text>
  <text x="315" y="312" fill="#94a3b8" font-size="11">Syncs AGENTS.md, openclaw.json, MCP tools, Subagents</text>

  <rect x="300" y="345" width="360" height="95" rx="8" fill="#172033" stroke="#10b981" stroke-width="1"/>
  <text x="315" y="368" fill="#10b981" font-size="12" font-weight="700">⚡ Proactive Triggers &amp; Outbound Proxy</text>
  <text x="315" y="388" fill="#cbd5e1" font-size="11">• Real-time WebSocket streaming &amp; typing indicators</text>
  <text x="315" y="405" fill="#cbd5e1" font-size="11">• Media &amp; Attachment Proxying</text>
  <text x="315" y="422" fill="#cbd5e1" font-size="11">• External Webhook Workload Triggers</text>

  <!-- OpenClaw Workspaces Column -->
  <rect x="700" y="70" width="280" height="390" fill="#131d31" rx="8"/>
  <text x="715" y="100" fill="#34d399" font-size="12" font-weight="700">ISOLATED OPENCLAW INSTANCES</text>

  <rect x="715" y="120" width="250" height="70" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="725" y="143" fill="#ffffff" font-size="12" font-weight="700">🔒 OpenClaw Workspace #101</text>
  <text x="725" y="162" fill="#a7f3d0" font-size="11">User: alex.dev (Mattermost)</text>
  <text x="725" y="177" fill="#6ee7b7" font-size="10">WS Connected • MCP Active</text>

  <rect x="715" y="205" width="250" height="70" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="725" y="228" fill="#ffffff" font-size="12" font-weight="700">🔒 OpenClaw Workspace #102</text>
  <text x="725" y="247" fill="#a7f3d0" font-size="11">User: m.stev (Telegram)</text>
  <text x="725" y="262" fill="#6ee7b7" font-size="10">WS Connected • MCP Active</text>

  <rect x="715" y="290" width="250" height="70" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="725" y="313" fill="#ffffff" font-size="12" font-weight="700">🔒 OpenClaw Workspace #103</text>
  <text x="725" y="332" fill="#a7f3d0" font-size="11">User: sarah.pm (Slack)</text>
  <text x="725" y="347" fill="#6ee7b7" font-size="10">WS Connected • MCP Active</text>

  <rect x="715" y="375" width="250" height="65" rx="6" fill="#1e293b"/>
  <text x="725" y="398" fill="#facc15" font-size="11" font-weight="600">⚡ Dify Fallback Layer</text>
  <text x="725" y="418" fill="#94a3b8" font-size="10">Active for unmapped guest users</text>
</svg>
